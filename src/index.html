<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redox Notes</title>
  <script>
    // Apply the theme before first paint so the window never flashes white in dark mode.
    try {
      var t = localStorage.getItem('redox.theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <main id="main">
      <div id="tabbar">
        <button id="show-sidebar" class="icon-btn" title="Show sidebar (Ctrl+\)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <div id="tabs"></div>
        <button id="new-tab" class="icon-btn" title="New…"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>
      <div id="editor"></div>
      <footer id="status"></footer>
    </main>
  </div>
  <div id="print-area"></div>
  <div id="toasts"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
