<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redox Notes</title>
  <script>
    // Apply the theme before first paint so the window never flashes white in dark mode.
    try {
      var t = localStorage.getItem('redox.theme') || 'system';
      var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <nav id="rail" aria-label="Main"></nav>
    <aside id="sidebar"></aside>
    <main id="main">
      <header id="topbar">
        <button id="show-sidebar" class="icon-btn" data-act="collapse" title="Show sidebar (Ctrl+\)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
        <button id="home-tab" class="tab-chip home" title="Dashboard"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></button>
        <div id="tabs"></div>
        <button id="new-tab" class="tab-chip round" title="New…"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <div id="topbar-right"></div>
      </header>
      <section id="sheet">
        <div id="editor"></div>
        <footer id="status"></footer>
      </section>
    </main>
  </div>
  <div id="print-area"></div>
  <div id="toasts"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
