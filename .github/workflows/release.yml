name: Build Windows app

# Builds Redox Notes for Windows and publishes the .exe files to GitHub Releases.
# Runs on every push, on version tags (v1.2.3) and manually from the Actions tab.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: npm install

      - name: Build
        run: npx tauri build

      - name: Collect the .exe files
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "src-tauri/target/release/redox-notes.exe" "out/RedoxNotes-$v-portable.exe"
          Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | ForEach-Object {
            Copy-Item $_.FullName "out/RedoxNotes-$v-setup.exe"
          }
          Get-ChildItem out | Format-Table Name, Length
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/upload-artifact@v4
        with:
          name: RedoxNotes-${{ env.VERSION }}-windows
          path: out/*.exe

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Redox Notes v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.exe
          body: |
            ## Download

            | File | What it is |
            |---|---|
            | **RedoxNotes-${{ env.VERSION }}-setup.exe** | Installer: adds Start-menu and desktop shortcuts. No admin rights needed. |
            | **RedoxNotes-${{ env.VERSION }}-portable.exe** | Single file: just double-click to run, from anywhere, even a USB stick. |

            Your notes are saved automatically to `Documents\RedoxNotes`.

            Needs Windows 10 or 11. If Windows SmartScreen warns about an unknown publisher, click **More info → Run anyway** (the app isn't code-signed).
